# This file lets you start a PostgreSQL database on your computer with one
# command, without installing PostgreSQL manually.
#
# "PostgreSQL" (Postgres) is the database - it's where we'll store emails,
# user info, and agent history in later blocks.

version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: email_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: email_agent
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
